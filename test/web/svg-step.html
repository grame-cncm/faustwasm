<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>Steppable diagrams</title>
    </head>
    <body style="font-family: sans-serif; margin: 12px">
        <p>Diagrams generated with <code>-sst &lt;n&gt;</code> and shown with
            <code>FaustSvgDiagrams.display</code>: click the diagram, then step with the arrow keys;
            links open the sub-diagrams at the same sample.</p>
        <textarea id="code" rows="5" cols="80">smooth = *(0.5) : + ~ *(0.5);
gate   = button("gate");
process = _ <: smooth, (*(gate) : smooth);</textarea><br>
        <label>Compiler args <input id="args" size="60" value="-sst 32 -f 0 -ssi 1 -ssc gate=1@3 -ssc gate=0@8"></label>
        <button id="draw">Draw</button>
        <pre id="error" style="color: #a12a12"></pre>
        <div id="diagram" style="border: 1px solid #ccc"></div>
        <script type="module">
            import { instantiateFaustModule, LibFaust, FaustCompiler, FaustSvgDiagrams } from "../../dist/esm-bundle/index.js";
            const compiler = new FaustCompiler(new LibFaust(await instantiateFaustModule()));
            const diagrams = new FaustSvgDiagrams(compiler);
            const draw = () => {
                const code = document.getElementById("code").value;
                const args = document.getElementById("args").value;
                document.getElementById("error").textContent = "";
                try {
                    FaustSvgDiagrams.display(document.getElementById("diagram"), diagrams.from("main", code, args));
                } catch (e) {
                    document.getElementById("error").textContent = e.message;
                }
            };
            document.getElementById("draw").onclick = draw;
            draw();
            window.diagramsReady = true;
        </script>
    </body>
</html>
