<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430"><defs><marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3d4451"/></marker><marker id="a0" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#3d4451"/></marker></defs><rect width="1000" height="430" fill="#ffffff"/><text x="24" y="34" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#1f2328" text-anchor="start">3 · Server mode inside faustgen~ (C++)</text><text x="24" y="56" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#57606a" text-anchor="start">One object, nothing else to install; the protocol and the host's rules rewritten in C++.</text><rect x="24" y="92" width="180" height="300" rx="24" fill="#ffffff" stroke="#2f6fd6" stroke-width="2.2"/><rect x="86.0" y="101" width="56" height="7" rx="3.5" fill="#2f6fd6" stroke="#2f6fd6" stroke-width="1.5"/><text x="114.0" y="132" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1f2328" text-anchor="middle">Phone</text><text x="114.0" y="150" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#57606a" text-anchor="middle">remote control PWA</text><rect x="38" y="168" width="152" height="50" rx="10" fill="#ddeaff" stroke="#2f6fd6" stroke-width="1.5"/><text x="114.0" y="190" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">faust-ui</text><text x="114.0" y="210" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#1f2328" text-anchor="middl