" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#1f2328" text-anchor="middle">groups, sensors</text><rect x="510" y="248" width="312" height="60" rx="10" fill="#dff3e4" stroke="#2e8b57" stroke-width="1.5"/><text x="666.0" y="270" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">DSP, LLVM JIT</text><text x="666.0" y="290" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#1f2328" text-anchor="middle">timed values applied inside the block</text><rect x="494" y="350" width="70" height="26" rx="4" fill="#ffffff" stroke="#1f2328" stroke-width="1.3"/><rect x="497.0" y="350" width="8" height="3" fill="#1f2328"/><rect x="553.0" y="350" width="8" height="3" fill="#1f2328"/><text x="502" y="368" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start">dac~</text><path d="M503,322 L503,350" fill="none" stroke="#7a8f2a" stroke-width="2" stroke-dasharray="6 3"/><text x="860" y="200" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#57606a" text-anchor="start" font-style="italic">sample-accurate</text><text x="860" y="216" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#57606a" text-anchor="start" font-style="italic">timed mode</text><text x="727" y="400" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#57606a" text-anchor="middle" font-style="italic">the same remote control for every native Faust target, if written as a RemoteUI</text></svg>
