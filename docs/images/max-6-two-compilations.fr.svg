<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="480" viewBox="0 0 1000 480"><defs><marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3d4451"/></marker><marker id="a0" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#3d4451"/></marker></defs><rect width="1000" height="480" fill="#ffffff"/><text x="24" y="34" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#1f2328" text-anchor="start">6 · Un source, deux compilations</text><text x="24" y="56" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#57606a" text-anchor="start">faustgen~ compile chaque DSP en IR LLVM pour Max et en wasm pour les téléphones, qui le jouent aussi.</text><rect x="370" y="76" width="260" height="56" rx="10" fill="#ffffff" stroke="#6e7781" stroke-width="1.5"/><text x="500.0" y="98" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2328" text-anchor="middle">Source Faust</text><text x="500.0" y="118" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#1f2328" text-anchor="middle">éditeur de faustgen~</text><path d="M450,132 L300,176" fill="none" stroke="#3d4451" stroke-width="2" marker-end="url(#a1)"/><path d="M550,132 L680,176" fill="none" stroke="#3d4451" stroke-width="2" marker-end="url(#a1)"/><text x="330" y="152" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#57606a" text-anchor="end">IR LLVM, JIT</text><text x="650" y="152" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#57606a" text-anchor="start">bac