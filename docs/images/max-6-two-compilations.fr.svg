ly="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="400" fill="#57606a" text-anchor="middle">client.js</text><path d="M440,300 L800,300" fill="none" stroke="#3d4451" stroke-width="2.4" marker-start="url(#a0)" marker-end="url(#a1)"/><text x="620.0" y="291" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#3d4451" text-anchor="middle">contrôles, dans les deux sens</text><path d="M440,340 L800,340" fill="none" stroke="#3d4451" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#a1)"/><text x="620" y="332" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#3d4451" text-anchor="middle">wasm et JSON, chargés avec l'empreinte</text><path d="M440,372 L800,372" fill="none" stroke="#3d4451" stroke-width="1.6" marker-end="url(#a1)"/><text x="620" y="364" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#3d4451" text-anchor="middle">message « dsp » : le DSP a changé</text><text x="500" y="466" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#57606a" text-anchor="middle" font-style="italic">mêmes chemins, plages et métadonnées des deux côtés ; le même DSP, pas les mêmes échantillons</text></svg>
